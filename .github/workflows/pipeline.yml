# Build, test and publish, as one reusable piece. Called by build.yml (pull
# requests, master pushes) and cut-release.yml (releases), so a release builds
# its own images: a tag pushed with GITHUB_TOKEN does not start other
# workflows, and this needs no personal token.
name: Pipeline

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to build
        type: string
        required: true
      run_tests:
        type: boolean
        default: true
      build_images:
        type: boolean
        default: true
      push:
        description: Push the images and tag them (false only checks they build)
        type: boolean
        default: false
      channel:
        description: "Image tag set, see scripts/release/version.mjs: none, edge, release, prerelease, preview"
        type: string
        default: none
      branch:
        description: The preview/<name> branch a preview build comes from, which names its tags
        type: string
        default: ""
      version:
        description: Release version baked into the image (empty for edge and pull requests)
        type: string
        default: ""
      latest:
        description: Move the latest tag
        type: boolean
        default: false
      line_latest:
        description: Move the YEAR.FEATURE tag
        type: boolean
        default: false
      edge:
        description: Also move the edge tag (a release cut from master is master's newest commit)
        type: boolean
        default: false
      fresh:
        description: Build without the layer cache, pulling the base image
        type: boolean
        default: false
      commit:
        description: >-
          Commit the image reports (label, version string, sha- tag), when it
          is not ref itself: a release builds the tested commit with the
          version applied, which is the release commit's content
        type: string
        default: ""
    outputs:
      digest:
        description: Digest of the published multi-platform image
        value: ${{ jobs.publish.outputs.digest }}

permissions:
  contents: read

env:
  # The base image, resolved to a digest at build time. Keep the tag in step
  # with NODE_VERSION in the Dockerfile.
  BASE_IMAGE: docker.io/library/node:22-bookworm-slim

jobs:
  # ESLint, the other checks and the tests run as three jobs side by side, each
  # on its own runner; they share nothing but the install. Every one of them
  # has to pass before publish (and build.yml's CI check). cut-release.yml
  # names them in TEST_JOBS.
  eslint:
    if: inputs.run_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup

      # The longest of the checks: a thread per core (auto takes half)
      - name: ESLint
        run: yarn lint:eslint --concurrency=4

  checks:
    if: inputs.run_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Type check, Prettier and Stylelint
        run: yarn run-p --aggregate-output --continue-on-error lint:types lint:prettier lint:stylelint

  test:
    if: inputs.run_tests
    runs-on: ubuntu-latest
    env:
      # The checks job type checks everything; the webpack builds here skip
      # their own fork-ts-checker pass
      THELOUNGE_SKIP_TYPECHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup

      # The production build (dist/ and public/), which the server tests and
      # the start-up check below use; the test bundle is a separate,
      # Node-targeted webpack build (test/public/testclient.cjs)
      - name: Build
        run: yarn build
        env:
          NODE_ENV: production

      - name: Test (server and client)
        run: yarn test:mocha

      # The tests run through a TypeScript loader that papers over ESM import
      # mistakes; start the built server under plain Node, as the image does
      - name: Start the built server
        run: |
          export THELOUNGE_HOME=$(mktemp -d)
          node index.js start > server.log 2>&1 &
          for _ in $(seq 30); do
            curl -sf -o /dev/null http://127.0.0.1:9000/ && { kill $!; exit 0; }
            kill -0 $! 2>/dev/null || break
            sleep 1
          done
          cat server.log
          echo "::error::the built server did not start"
          exit 1

  # Each architecture builds on a native runner, in parallel with the tests.
  # Without push this only checks that the Dockerfile builds.
  image:
    if: inputs.build_images
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Names
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          echo "GIT_COMMIT=${COMMIT:-$(git rev-parse HEAD)}" >> "$GITHUB_ENV"
        env:
          COMMIT: ${{ inputs.commit }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The runner is thrown away after the job; removing the builder
          # first only costs time
          cleanup: false

      - name: Log in to ghcr.io
        if: inputs.push
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pin the base by digest, so the label below says exactly what the image
      # was built on (the weekly refresh compares it)
      - name: Resolve the base image
        run: |
          digest=$(docker buildx imagetools inspect "$BASE_IMAGE" --format '{{json .Manifest}}' | jq -r .digest)
          [[ $digest == sha256:* ]] || { echo "::error::could not resolve $BASE_IMAGE"; exit 1; }
          echo "BASE_DIGEST=$digest" >> "$GITHUB_ENV"

      - name: Labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.version=${{ inputs.version || (inputs.channel == 'preview' && 'preview' || 'edge') }}
            org.opencontainers.image.revision=${{ env.GIT_COMMIT }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.base.name=${{ env.BASE_IMAGE }}
            org.opencontainers.image.base.digest=${{ env.BASE_DIGEST }}

      # Pushed untagged, by digest; the publish job tags the combined image
      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # THELOUNGE_SKIP_TYPECHECK: every image CI builds is of a commit that is
          # type checked: in this call, by master's CI before a release, or
          # released already (refresh)
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}@${{ env.BASE_DIGEST }}
            VERSION=${{ inputs.version }}
            GIT_COMMIT=${{ env.GIT_COMMIT }}
            THELOUNGE_SKIP_TYPECHECK=1
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ inputs.push }}
          # Build provenance and an SBOM, attached to pushed images only
          provenance: ${{ inputs.push && 'mode=max' || 'false' }}
          sbom: ${{ inputs.push }}
          pull: ${{ inputs.fresh }}
          no-cache: ${{ inputs.fresh }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Save digest
        if: inputs.push
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: inputs.push
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          retention-days: 1

  # Tags the amd64 + arm64 images as one, once the tests have passed too
  # (or were not asked for). With build_images false it tags the digests an
  # earlier call in the same run uploaded: cut-release.yml builds the images
  # alongside the tests and publishes them only after it has tagged.
  publish:
    needs: [eslint, checks, test, image]
    if: >-
      !cancelled() && inputs.push && inputs.channel != 'none'
      && (needs.image.result == 'success' || (needs.image.result == 'skipped' && !inputs.build_images))
      && !contains(fromJSON('["failure", "cancelled"]'), needs.eslint.result)
      && !contains(fromJSON('["failure", "cancelled"]'), needs.checks.result)
      && !contains(fromJSON('["failure", "cancelled"]'), needs.test.result)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      # The tag policy script comes from the workflow's own commit, not from
      # the ref being built
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/release
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.commit == ''
        with:
          ref: ${{ inputs.ref }}
          path: built
          persist-credentials: false

      - name: Image tags
        id: tags
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          LATEST: ${{ inputs.latest }}
          LINE_LATEST: ${{ inputs.line_latest }}
          EDGE: ${{ inputs.edge }}
          COMMIT: ${{ inputs.commit }}
          BRANCH: ${{ inputs.branch }}
        run: |
          node scripts/release/version.mjs image-tags --image "ghcr.io/${GITHUB_REPOSITORY,,}" \
            --channel "$CHANNEL" --version "$VERSION" --sha "${COMMIT:-$(git -C built rev-parse HEAD)}" \
            --latest "$LATEST" --line-latest "$LINE_LATEST" --edge "$EDGE" --branch "$BRANCH"

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The runner is thrown away after the job; removing the builder
          # first only costs time
          cleanup: false

      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the multi-platform image
        id: push
        working-directory: /tmp/digests
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          args=()
          while read -r tag; do [[ -n $tag ]] && args+=(-t "$tag"); done <<< "$TAGS"
          sources=()
          for d in *; do sources+=("$image@sha256:$d"); done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "${args[1]}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          { echo "### Published $image@$digest"; echo "- ${TAGS//$'\n'/$'\n'- }"; } >> "$GITHUB_STEP_SUMMARY"

      # Signed provenance on GitHub (gh attestation verify), keyed to the
      # image digest; uses the workflow's OIDC token, no secret needed
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
