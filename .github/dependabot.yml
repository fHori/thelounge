# Weekly dependency updates, grouped so each week is a handful of pull requests.
# They merge like any other pull request and reach users with the next release.
version: 2
updates:
  - package-ecosystem: npm # also covers yarn.lock
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Yarn refuses versions published less than a day ago (.yarnrc.yml), and
    # a few days lets broken releases get pulled before they reach us
    cooldown:
      default-days: 3
    commit-message:
      prefix: deps
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # 2.1.x declares itself an ES module but is CommonJS inside, which
      # breaks the client build ("require is not defined in ES module scope")
      - dependency-name: babel-preset-typescript-vue3
        versions: [">=2.1.0"]
      # 6 needs Node.js 22.22 or newer, this project supports 20
      - dependency-name: read
        update-types: ["version-update:semver-major"]
      # 2 and 3 change the API and no longer strip directories from the
      # file name, for nothing this project would notice
      - dependency-name: content-disposition
        update-types: ["version-update:semver-major"]
      # 9.2.0 reports TS6305 for the referenced projects' outputs when it runs
      # without build mode, which breaks yarn test, dev and watch locally. CI
      # skips this checker (THELOUNGE_SKIP_TYPECHECK), so its checks pass.
      - dependency-name: fork-ts-checker-webpack-plugin
        versions: [">=9.2.0"]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # The Node.js base image. Its digest is also refreshed in released images by
  # the weekly refresh workflow; this keeps the pin in the Dockerfile current.
  # Major Node.js versions are upgraded deliberately, not by a bot.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
