name: Docs

permissions:
  contents: read

# Build skips changes to documentation alone, which would also skip the
# formatting check its lint step runs on Markdown. This keeps that check, with
# the Prettier version from yarn.lock, without installing everything else.
on:
  push:
    branches: [master]
    paths:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - name: Check formatting
        run: |
          version=$(grep -A3 '^"prettier@' yarn.lock | grep -m1 '^  version' | grep -o '[0-9][0-9.]*')
          echo "Prettier $version"
          npx --yes "prettier@$version" --check "**/*.md"
