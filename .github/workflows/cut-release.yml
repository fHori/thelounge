# Cuts a release: tests and images (side by side), version bump commit and
# tag, publishing the images, GitHub Release.
# Run it from Actions > Release > Run workflow; see docs/RELEASING.md.
# refresh.yml calls it weekly to cut a base-image refresh release.
#
# Everything uses GITHUB_TOKEN, except pushing the release commit to master:
# master's ruleset requires the CI check, which GITHUB_TOKEN cannot bypass on
# a personal repository, so that push uses the RELEASE_DEPLOY_KEY deploy key,
# which the ruleset lets through. The images are built here, through the
# reusable pipeline.yml; Build skips the release commit.
#
# The images are built from the tested commit with the version applied (the
# Dockerfile does that, from VERSION), which is the release commit's content,
# while the tests run. They report the release commit: plan names it before
# it exists (scripts/release/release-commit.sh writes it the same way every
# time) and tag writes it once the tests have passed. Nothing is tagged or
# published before that. Tests already passed by master's CI on that exact
# commit are not run again.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "auto: feature release if features or a storage change were merged, else patch. feature/patch force one."
        type: choice
        options: [auto, feature, patch]
        default: auto
      version:
        description: "Explicit version (overrides bump), e.g. 2026.11.3 or 2026.12.0-rc.1. An existing tag resumes that release."
        type: string
        default: ""
      prerelease:
        description: Release candidate (-rc.N; publishes :next, not :latest)
        type: boolean
        default: false
      dry_run:
        description: "Dry run: test, build and write the notes, but push, tag and publish nothing"
        type: boolean
        default: false
  workflow_call:
    inputs:
      refresh:
        description: Base-image refresh of the newest release (cut only if the base image changed)
        type: boolean
        default: false
      bump:
        type: string
        default: patch
      version:
        type: string
        default: ""
      prerelease:
        type: boolean
        default: false
      dry_run:
        type: boolean
        default: false

# One release at a time; a second one waits, it is never cancelled
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Keep in step with pipeline.yml
  BASE_IMAGE: docker.io/library/node:22-bookworm-slim
  # true: commit the version to package.json and tag that commit (pushed to
  # the branch together with the tag). false: tag the tested commit as is;
  # the image still reports the right version (build arg), but package.json
  # in git keeps its old version. Use false if the deploy key
  # (RELEASE_DEPLOY_KEY) is ever removed: master's ruleset would refuse the
  # push.
  COMMIT_BUMP: "true"
  # The jobs of pipeline.yml that make up the tests, as build.yml's runs name
  # them. A release skips its tests when all of them passed on its commit.
  TEST_JOBS: "pipeline / lint,pipeline / types,pipeline / test"

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      actions: read # master's CI runs, to skip tests that already passed
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      tested: ${{ steps.plan.outputs.tested }}
      release_commit: ${{ steps.plan.outputs.release_commit }}
      commit_date: ${{ steps.plan.outputs.commit_date }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      exists: ${{ steps.plan.outputs.exists }}
      latest: ${{ steps.plan.outputs.latest }}
      line_latest: ${{ steps.plan.outputs.line_latest }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      first_base: ${{ steps.plan.outputs.first_base }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      refresh_of: ${{ steps.plan.outputs.refresh_of }}
      old_base_digest: ${{ steps.plan.outputs.old_base_digest }}
      new_base_digest: ${{ steps.plan.outputs.new_base_digest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all tags
          persist-credentials: false

      - name: Log in to ghcr.io
        if: inputs.refresh
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH: ${{ inputs.refresh }}
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          S=scripts/release/version.mjs
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          note() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }

          # An unfinished release (tag without GitHub Release) blocks new
          # ones, so a full re-run cannot skip ahead to the next number
          newest_tag=$(node $S forks | tail -n 1)
          if [[ -n $newest_tag && -z $VERSION ]] && ! gh release view "$newest_tag" > /dev/null 2>&1; then
            echo "::error::$newest_tag is tagged but has no GitHub Release. Finish it (run with version=$newest_tag) or delete the tag first."
            exit 1
          fi

          if [[ $REFRESH == true ]]; then
            newest=$(node $S newest | sed -n 's/^tag=//p')
            if [[ -z $newest ]]; then
              note "No release yet: nothing to refresh."
              out skip true
              exit 0
            fi
            image="ghcr.io/${GITHUB_REPOSITORY,,}"
            old=$(docker buildx imagetools inspect "$image:${newest#v}" --format '{{json .Image}}' \
              | jq -r '[.. | objects | .config?.Labels?["org.opencontainers.image.base.digest"]? // empty] | first // ""')
            new=$(docker buildx imagetools inspect "$BASE_IMAGE" --format '{{json .Manifest}}' | jq -r .digest)
            [[ $new == sha256:* ]] || { echo "::error::could not resolve $BASE_IMAGE"; exit 1; }
            out old_base_digest "$old"
            out new_base_digest "$new"
            if [[ $old == "$new" ]]; then
              note "$newest is already built on $BASE_IMAGE@$new: nothing to refresh."
              out skip true
              exit 0
            fi
            node $S next --bump "$BUMP"
            out base_sha "$(git rev-list -n 1 "$newest")"
            out refresh_of "$newest"
          else
            # A dry run may start from any branch, to try out workflow changes
            case $GITHUB_REF in
              refs/heads/master | refs/heads/release/*) ;;
              *) [[ $DRY_RUN == true ]] || { echo "::error::Release from master, or from a release/* branch for a hotfix of an older line"; exit 1; } ;;
            esac
            node $S next --bump "$BUMP" --version "$VERSION" --prerelease "$PRERELEASE" | tee plan.txt
            tag=$(sed -n 's/^tag=//p' plan.txt)
            if grep -q '^exists=true' plan.txt; then
              note "Resuming $tag: the tag exists, building and publishing it."
              out base_sha "$(git rev-list -n 1 "$tag")"
            else
              out base_sha "$GITHUB_SHA"
            fi
          fi

          base=$(sed -n 's/^base_sha=//p' "$GITHUB_OUTPUT" | tail -n 1)
          version=$(sed -n 's/^version=//p' "$GITHUB_OUTPUT" | tail -n 1)
          tag=$(sed -n 's/^tag=//p' "$GITHUB_OUTPUT" | tail -n 1)
          exists=$(sed -n 's/^exists=//p' "$GITHUB_OUTPUT" | tail -n 1)

          # The commit the release will be: written by the tag job, after
          # the tests, exactly like this
          if [[ $exists != true && $COMMIT_BUMP == true ]]; then
            when=$(date +%s)
            commit=$(scripts/release/release-commit.sh "$base" "$version" "$tag" "$when")
            out commit_date "$when"
          else
            commit=$base
          fi
          out release_commit "$commit"

          # master's CI (build.yml) runs every test job on each commit pushed
          # to master. If all of them passed on this one, do not run them again.
          tested=false
          if [[ $exists != true && $REFRESH != true ]]; then
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?head_sha=$base&event=push&status=success" \
              -q '.workflow_runs[0].id // empty')
            if [[ -n $run ]]; then
              passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" \
                -q '[.jobs[] | select(.conclusion == "success") | .name] as $ok
                  | env.TEST_JOBS | split(",") | all(. as $j | $ok | any(. == $j))')
              if [[ $passed == true ]]; then
                tested=true
                note "Tests skipped: they passed on ${base:0:7} in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"
              fi
            fi
          fi
          out tested "$tested"
          out skip false

      - name: Summary
        if: steps.plan.outputs.skip == 'false'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          PREVIOUS: ${{ steps.plan.outputs.previous_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          FEATURES: ${{ steps.plan.outputs.features }}
        run: |
          prefix=""
          [[ $DRY_RUN == true ]] && prefix="Dry run: "
          echo "### ${prefix}$TAG (previous: ${PREVIOUS:-none})" >> "$GITHUB_STEP_SUMMARY"
          if [[ $FEATURES == true ]]; then
            echo "Feature release: new features or a storage change since ${PREVIOUS:-the start}." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Tests and both images, side by side. The images are built from the tested
  # commit with the version applied and report the planned release commit;
  # they are pushed by digest only, untagged, until publish. A refresh
  # rebuilds a released commit and skips the tests, as does a commit master's
  # CI already tested (plan).
  build:
    needs: plan
    if: needs.plan.outputs.skip == 'false'
    uses: ./.github/workflows/pipeline.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      ref: ${{ needs.plan.outputs.base_sha }}
      run_tests: ${{ needs.plan.outputs.exists != 'true' && needs.plan.outputs.tested != 'true' && inputs.refresh != true }}
      build_images: true
      push: ${{ !inputs.dry_run }}
      channel: none
      version: ${{ needs.plan.outputs.version }}
      commit: ${{ needs.plan.outputs.release_commit }}
      # `refresh` only exists when called from refresh.yml; when the workflow
      # is started by hand it is empty, which a boolean input refuses
      fresh: ${{ inputs.refresh == true }}

  tag:
    needs: [plan, build]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.skip == 'false'
      && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      EXISTS: ${{ needs.plan.outputs.exists }}
      BASE_SHA: ${{ needs.plan.outputs.base_sha }}
      RELEASE_COMMIT: ${{ needs.plan.outputs.release_commit }}
      COMMIT_DATE: ${{ needs.plan.outputs.commit_date }}
      REFRESH: ${{ inputs.refresh }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:
      # Pushes with the deploy key, which master's ruleset lets through. When
      # called from refresh.yml there is no secret and the token is used: a
      # refresh pushes only its tag, which the ruleset does not cover.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.base_sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Bump, commit and tag
        id: tag
        run: |
          set -euo pipefail
          if [[ $EXISTS == true ]]; then
            echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # "Re-run failed jobs" after this job had already pushed
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG was pushed by an earlier attempt; using it"
            git fetch -q origin "refs/tags/$TAG:refs/tags/$TAG"
            tagged=$(git rev-parse "$TAG^{commit}")
            if [[ $tagged != "$RELEASE_COMMIT" ]]; then
              echo "::error::$TAG is $tagged, but the images were built as $RELEASE_COMMIT"
              exit 1
            fi
            echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          commit=$BASE_SHA
          if [[ $COMMIT_BUMP == true ]]; then
            # The commit plan named, which the images already report. The
            # script comes from the workflow's commit: an older base (a
            # refresh) may not have it.
            git show "$GITHUB_SHA:scripts/release/release-commit.sh" > "$RUNNER_TEMP/release-commit.sh"
            commit=$(bash "$RUNNER_TEMP/release-commit.sh" "$BASE_SHA" "$VERSION" "$TAG" "$COMMIT_DATE")
          fi
          if [[ $commit != "$RELEASE_COMMIT" ]]; then
            echo "::error::the release commit is $commit, but plan named $RELEASE_COMMIT"
            exit 1
          fi
          git tag -a "$TAG" -m "$TAG" "$commit"

          if [[ $DRY_RUN == true ]]; then
            git show --stat "$commit" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ref=$BASE_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ $REFRESH == true || $COMMIT_BUMP != true ]]; then
            # A refresh release is its own commit on top of the release it
            # rebuilds, reachable only through its tag
            git push origin "refs/tags/$TAG"
          else
            # Branch and tag together or not at all. Fails if the branch
            # moved since the tested commit: dispatch the release again.
            git push --atomic origin "$commit:refs/heads/$GITHUB_REF_NAME" "refs/tags/$TAG"
          fi
          echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"

  # Tags the images build pushed, now that the git tag is out
  publish:
    needs: [plan, build, tag]
    if: ${{ !cancelled() && needs.tag.result == 'success' }}
    uses: ./.github/workflows/pipeline.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      ref: ${{ needs.tag.outputs.ref }}
      run_tests: false
      build_images: false
      push: ${{ !inputs.dry_run }}
      channel: ${{ needs.plan.outputs.prerelease == 'true' && 'prerelease' || 'release' }}
      version: ${{ needs.plan.outputs.version }}
      commit: ${{ needs.plan.outputs.release_commit }}
      latest: ${{ needs.plan.outputs.latest == 'true' }}
      line_latest: ${{ needs.plan.outputs.line_latest == 'true' }}
      # The release commit becomes master's newest commit, and Build skips
      # it, so the release image is also edge. Not for a refresh or a
      # hotfix from a release/* branch, which are not master's newest code.
      edge: ${{ github.ref_name == github.event.repository.default_branch && inputs.refresh != true }}

  # Last, so a published release always has its images
  release:
    needs: [plan, tag, publish]
    # A dry run publishes nothing, but still writes the notes
    if: >-
      !cancelled() && (needs.publish.result == 'success'
      || (inputs.dry_run && needs.tag.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
      LATEST: ${{ needs.plan.outputs.latest }}
      PREVIOUS: ${{ needs.plan.outputs.previous_tag || needs.plan.outputs.first_base }}
      TO: ${{ inputs.dry_run && needs.plan.outputs.base_sha || needs.plan.outputs.tag }}
      REFRESH_OF: ${{ needs.plan.outputs.refresh_of }}
      OLD_BASE: ${{ needs.plan.outputs.old_base_digest }}
      NEW_BASE: ${{ needs.plan.outputs.new_base_digest }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and history for the notes
          persist-credentials: false

      - name: Release notes
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ -n $REFRESH_OF ]]; then
            node scripts/release/notes.mjs --version "$VERSION" --image "$image" \
              --refresh-of "$REFRESH_OF" --base-image "$BASE_IMAGE@$NEW_BASE" --old-base-digest "$OLD_BASE" > notes.md
          else
            node scripts/release/notes.mjs --from "$PREVIOUS" --to "$TO" --version "$VERSION" --image "$image" > notes.md
          fi
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update the GitHub Release
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md --prerelease="$PRERELEASE" --latest="$LATEST"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md \
              --prerelease="$PRERELEASE" --latest="$LATEST"
          fi
