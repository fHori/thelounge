name: Build

permissions:
  contents: read

# Releases (versioned image tags and :latest) are cut by cut-release.yml; this
# workflow checks pull requests and publishes master as :edge.
#
# Changes to documentation alone skip it: Markdown is not in the image
# (.dockerignore) and no code reads it. docs.yml checks its formatting.
on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"

# A new push to a pull request cancels its older, still running checks
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tests and per-architecture image builds run in parallel, as before.
  # Pull requests stop at checking that the image builds; master pushes
  # publish :edge and :sha-<short>.
  pipeline:
    uses: ./.github/workflows/pipeline.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      ref: ${{ github.sha }}
      push: ${{ github.event_name == 'push' }}
      channel: ${{ github.event_name == 'push' && 'edge' || 'none' }}
